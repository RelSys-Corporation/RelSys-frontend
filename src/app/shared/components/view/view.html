<div class="container">
  <mat-card class="main-card">
    <mat-card-header class="card-header">
      <mat-card-title> Visualização de {{ displayName() | titlecase }} </mat-card-title>
      <span class="divider"></span>
      <button matButton="filled" (click)="createNew()">Adicionar</button>
    </mat-card-header>

    <table mat-table [dataSource]="dataSource()" class="table">
      @for (column of displayedColumns(); track column) {
        <ng-container [matColumnDef]="column.dataName">
          <th mat-header-cell *matHeaderCellDef> {{ column.name }} </th>
          <td mat-cell *matCellDef="let data"> {{ data[column.dataName] }} </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="columnNames()"></tr>
      <tr mat-row
        (click)="edit(row.id)"
        *matRowDef="let row; columns: columnNames();"
      ></tr>
    </table>

    <span class="divider-h"></span>

    <mat-paginator [pageSizeOptions]="[9]"
                   showFirstLastButtons>
    </mat-paginator>


  </mat-card>
</div>
