<mat-toolbar class="toolbar">
  <button mat-icon-button (click)="opened.set(!opened())" aria-label="Toggle sidebar">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="toolbar-title">RelSys</span>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    [opened]="opened()"
    mode="side"
    class="sidenav"
  >
    <mat-nav-list>
      @for (item of navItems; track item.label) {
        @if (item.route) {
          <a
            mat-list-item
            [routerLink]="item.route"
            routerLinkActive
            #rla="routerLinkActive"
            [activated]="rla.isActive"
            [class.active]="rla.isActive"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        } @else if (item.children) {
          <div class="nav-group">
            <div
              class="nav-group-toggle"
              (click)="toggleProdutos()"
              role="button"
              tabindex="0"
              (keydown.enter)="toggleProdutos()"
              (keydown.space)="toggleProdutos(); $event.preventDefault()"
            >
              <mat-icon>{{ item.icon }}</mat-icon>
              <span class="nav-group-label">{{ item.label }}</span>
              <mat-icon class="expand-icon" [class.expanded]="produtosExpanded()">
                expand_more
              </mat-icon>
            </div>
            @if (produtosExpanded()) {
              <div class="sub-items">
                @for (child of item.children; track child.route) {
                  <a
                    mat-list-item
                    class="sub-item"
                    [routerLink]="child.route"
                    routerLinkActive
                    #rla="routerLinkActive"
                    [activated]="rla.isActive"
                    [class.active]="rla.isActive"
                  >
                    <mat-icon matListItemIcon>{{ child.icon }}</mat-icon>
                    <span matListItemTitle>{{ child.label }}</span>
                  </a>
                }
              </div>
            }
          </div>
        }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <div class="content-wrapper">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
